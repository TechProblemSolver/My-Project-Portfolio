  <style>
    body {
      box-sizing: border-box;
    }
    
    .dollhouse {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 8px;
      background: #8b4513;
      padding: 12px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    
    .room {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      min-height: 280px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 3px solid transparent;
    }
    
    .room:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    
    .room.active {
      border-color: #ec4899;
      box-shadow: 0 0 0 4px rgba(236, 72, 153, 0.2);
    }
    
    .doll-character {
      position: relative;
      width: 80px;
      height: 160px;
      margin: 10px;
      cursor: grab;
      transition: transform 0.2s ease;
      user-select: none;
    }
    
    .doll-character:hover {
      transform: scale(1.05);
    }
    
    .doll-character.selected {
      transform: scale(1.1);
      filter: drop-shadow(0 0 8px rgba(236, 72, 153, 0.6));
    }
    
    .doll-character.dragging {
      opacity: 0.5;
      cursor: grabbing;
    }
    
    .clothing-item {
      cursor: pointer;
      transition: all 0.2s ease;
      border: 3px solid transparent;
    }
    
    .clothing-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
    }
    
    .clothing-item.selected {
      border-color: #ec4899;
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.2);
    }
    
    .tab-btn {
      transition: all 0.2s ease;
      cursor: pointer;
    }
    
    .tab-btn:hover {
      transform: translateY(-2px);
    }
    
    .furniture-item {
      position: absolute;
      cursor: move;
    }
    
    .bedroom-bg {
      background: linear-gradient(180deg, #fce7f3 0%, #fbcfe8 100%);
    }
    
    .kitchen-bg {
      background: linear-gradient(180deg, #fef3c7 0%, #fde68a 100%);
    }
    
    .living-bg {
      background: linear-gradient(180deg, #dbeafe 0%, #bfdbfe 100%);
    }
    
    .bathroom-bg {
      background: linear-gradient(180deg, #e0f2fe 0%, #bae6fd 100%);
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>

    function renderCharacterSelection() {

    function renderDollSVG(charId, scale = 80) {
      const char = characters.find(c => c.id === charId);
      const outfit = characterOutfits[charId];
      const heightScale = char.height / 160;
      const actualHeight = scale * heightScale;
      
      let svg = `<svg width="${scale}" height="${actualHeight}" viewBox="0 0 80 ${char.height}" style="display: inline-block;">`;
      
      // Head
      svg += `<ellipse cx="40" cy="${char.height * 0.15}" rx="12" ry="14" fill="${char.skin}"/>`;
      // Eyes
      svg += `<circle cx="36" cy="${char.height * 0.14}" r="1.5" fill="#333"/>`;
      svg += `<circle cx="44" cy="${char.height * 0.14}" r="1.5" fill="#333"/>`;
      // Smile
      svg += `<path d="M 36 ${char.height * 0.17} Q 40 ${char.height * 0.18} 44 ${char.height * 0.17}" stroke="#333" stroke-width="1" fill="none"/>`;
      
      // Hair
      if (outfit.hair) {
        const hairItem = wardrobe[charId].hair.find(h => h.id === outfit.hair);
        if (hairItem) {
          svg += `<ellipse cx="40" cy="${char.height * 0.12}" rx="13" ry="10" fill="${hairItem.color}"/>`;
        }
      }
      
      // Accessory
      if (outfit.accessory) {
        const acc = wardrobe[charId].accessories.find(a => a.id === outfit.accessory);
        if (acc) {
          if (acc.type === 'glasses') {
            svg += `<circle cx="36" cy="${char.height * 0.14}" r="3" fill="none" stroke="#333" stroke-width="1"/>`;
            svg += `<circle cx="44" cy="${char.height * 0.14}" r="3" fill="none" stroke="#333" stroke-width="1"/>`;
          } else if (acc.type === 'bow') {
            svg += `<path d="M 32 ${char.height * 0.1} L 36 ${char.height * 0.12} L 40 ${char.height * 0.1} L 44 ${char.height * 0.12} L 48 ${char.height * 0.1}" fill="#ff1493"/>`;
          } else if (acc.type === 'crown') {
            svg += `<path d="M 30 ${char.height * 0.08} L 34 ${char.height * 0.11} L 40 ${char.height * 0.07} L 46 ${char.height * 0.11} L 50 ${char.height * 0.08}" fill="#fbbf24"/>`;
          } else if (acc.type === 'cap') {
            svg += `<ellipse cx="40" cy="${char.height * 0.1}" rx="14" ry="6" fill="#3b82f6"/>`;
            svg += `<ellipse cx="48" cy="${char.height * 0.11}" rx="8" ry="3" fill="#2563eb"/>`;
          } else if (acc.type === 'hat') {
            svg += `<rect x="28" y="${char.height * 0.08}" width="24" height="6" fill="#8b5a3c"/>`;
            svg += `<ellipse cx="40" cy="${char.height * 0.08}" rx="12" ry="4" fill="#a16d4a"/>`;
          }
        }
      }
      
      // Neck
      svg += `<rect x="35" y="${char.height * 0.25}" width="10" height="8" fill="${char.skin}"/>`;
      
      // Body/Top
      const topY = char.height * 0.3;
      const topHeight = char.height * 0.35;
      if (outfit.top) {
        const topItem = wardrobe[charId].tops.find(t => t.id === outfit.top);
        if (topItem) {
          svg += `<rect x="25" y="${topY}" width="30" height="${topHeight}" rx="3" fill="${topItem.color}" ${topItem.stroke ? `stroke="${topItem.stroke}" stroke-width="1"` : ''}/>`;
          // Arms
          svg += `<rect x="18" y="${topY + 5}" width="7" height="${topHeight * 0.7}" rx="3" fill="${topItem.color}"/>`;
          svg += `<rect x="55" y="${topY + 5}" width="7" height="${topHeight * 0.7}" rx="3" fill="${topItem.color}"/>`;
        }
      } else {
        svg += `<rect x="25" y="${topY}" width="30" height="${topHeight}" rx="3" fill="${char.skin}"/>`;
        svg += `<rect x="18" y="${topY + 5}" width="7" height="${topHeight * 0.7}" rx="3" fill="${char.skin}"/>`;
        svg += `<rect x="55" y="${topY + 5}" width="7" height="${topHeight * 0.7}" rx="3" fill="${char.skin}"/>`;
      }
      
      // Bottom/Legs
      const bottomY = topY + topHeight;
      const legHeight = char.height - bottomY - 2;
      if (outfit.bottom) {
        const bottomItem = wardrobe[charId].bottoms.find(b => b.id === outfit.bottom);
        if (bottomItem) {
          svg += `<rect x="28" y="${bottomY}" width="10" height="${legHeight}" rx="5" fill="${bottomItem.color}"/>`;
          svg += `<rect x="42" y="${bottomY}" width="10" height="${legHeight}" rx="5" fill="${bottomItem.color}"/>`;
        }
      } else {
        svg += `<rect x="28" y="${bottomY}" width="10" height="${legHeight}" rx="5" fill="${char.skin}"/>`;
        svg += `<rect x="42" y="${bottomY}" width="10" height="${legHeight}" rx="5" fill="${char.skin}"/>`;
      }
      
      // Shoes
      svg += `<ellipse cx="33" cy="${char.height - 2}" rx="6" ry="3" fill="#333"/>`;
      svg += `<ellipse cx="47" cy="${char.height - 2}" rx="6" ry="3" fill="#333"/>`;
      
      svg += `</svg>`;
      return svg;
    }

    function renderClothingGrid() {
      const grid = document.getElementById('clothing-grid');
      const items = wardrobe[selectedCharacter][currentCategory];
      const outfitKey = currentCategory === 'tops' ? 'top' : currentCategory === 'bottoms' ? 'bottom' : currentCategory === 'hair' ? 'hair' : 'accessory';
      
      grid.innerHTML = items.map(item => {
        const isSelected = characterOutfits[selectedCharacter][outfitKey] === item.id;
        return `
          <div class="clothing-item ${isSelected ? 'selected' : ''} bg-gradient-to-br from-pink-50 to-purple-50 rounded-lg p-3 text-center" data-item="${item.id}">
            <div class="w-full h-12 rounded mb-2 flex items-center justify-center" style="background: ${item.color || '#f3f4f6'}">
              ${item.type ? getAccessoryIcon(item.type) : ''}
            </div>
            <p class="text-xs font-semibold text-gray-700">${item.name}</p>
          </div>
        `;
      }).join('');
      
      grid.querySelectorAll('.clothing-item').forEach(el => {
        el.addEventListener('click', () => {
          const itemId = el.dataset.item;
          const outfitKey = currentCategory === 'tops' ? 'top' : currentCategory === 'bottoms' ? 'bottom' : currentCategory === 'hair' ? 'hair' : 'accessory';
          
          if (characterOutfits[selectedCharacter][outfitKey] === itemId) {
            characterOutfits[selectedCharacter][outfitKey] = null;
          } else {
            characterOutfits[selectedCharacter][outfitKey] = itemId;
          }
          
          renderClothingGrid();
          updateDollsInRooms();
        });
      });
    }

    function getAccessoryIcon(type) {
      const icons = {
        glasses: '👓',
        necklace: '📿',
        hat: '👒',
        tie: '👔',
        watch: '⌚',
        bow: '🎀',
        crown: '👑',
        backpack: '🎒',
        cap: '🧢'
      };
      return `<span style="font-size: 24px">${icons[type] || '✨'}</span>`;
    }

    function updateDollsInRooms() {
      ['bedroom', 'kitchen', 'living', 'bathroom'].forEach(room => {
        const container = document.getElementById(`${room}-dolls`);
        const dollsInRoom = characters.filter(char => 
          characterRooms[char.id] === room && characterBuildings[char.id] === currentBuilding
        );
        container.innerHTML = dollsInRoom.map(char => 
          `<div class="doll-character" draggable="true" data-character="${char.id}">${renderDollSVG(char.id)}</div>`
        ).join('');
        
        // Add drag event listeners
        container.querySelectorAll('.doll-character').forEach(doll => {
          doll.addEventListener('dragstart', handleDragStart);
          doll.addEventListener('dragend', handleDragEnd);
        });
      });
      
      // Render furniture items
      renderFurniture();
    }

    function renderFurniture() {
      ['bedroom', 'kitchen', 'living', 'bathroom'].forEach(room => {
        const roomElement = document.querySelector(`.room[data-room="${room}"]`);
        
        // Remove existing furniture items
        roomElement.querySelectorAll('.furniture-item').forEach(item => item.remove());
        
        // Add furniture for this room
        Object.values(furniture[room]).forEach(item => {
          const pos = furniturePositions[item.id];
          if (pos.room === room) {
            const furnitureEl = document.createElement('div');
            furnitureEl.className = 'furniture-item';
            furnitureEl.draggable = true;
            furnitureEl.dataset.furniture = item.id;
            furnitureEl.style.left = `${pos.x}px`;
            furnitureEl.style.top = `${pos.y}px`;
            furnitureEl.style.fontSize = '32px';
            furnitureEl.style.cursor = 'grab';
            furnitureEl.textContent = item.name.split(' ')[0];
            furnitureEl.title = item.name;
            
            furnitureEl.addEventListener('dragstart', handleFurnitureDragStart);
            furnitureEl.addEventListener('dragend', handleDragEnd);
            
            roomElement.appendChild(furnitureEl);
          }
        });
      });
    }

    let draggedCharacter = null;
    let draggedFurniture = null;

    function handleDragStart(e) {
      draggedCharacter = e.target.dataset.character;
      draggedFurniture = null;
      e.target.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/html', e.target.innerHTML);
    }

    function handleFurnitureDragStart(e) {
      draggedFurniture = e.target.dataset.furniture;
      draggedCharacter = null;
      e.target.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/html', e.target.innerHTML);
    }

    function handleDragEnd(e) {
      e.target.classList.remove('dragging');
    }

    function handleDragOver(e) {
      if (e.preventDefault) {
        e.preventDefault();
      }
      e.dataTransfer.dropEffect = 'move';
      return false;
    }

    function handleDrop(e) {
      if (e.stopPropagation) {
        e.stopPropagation();
      }
      
      const roomName = e.currentTarget.dataset.room;
      
      if (draggedCharacter && roomName) {
        characterRooms[draggedCharacter] = roomName;
        updateDollsInRooms();
        
        e.currentTarget.classList.add('active');
        setTimeout(() => e.currentTarget.classList.remove('active'), 500);
      } else if (draggedFurniture && roomName) {
        // Move furniture to new room
        furniturePositions[draggedFurniture] = {
          room: roomName,
          x: Math.min(Math.max(20, e.offsetX - 16), 220),
          y: Math.min(Math.max(30, e.offsetY - 16), 240)
        };
        renderFurniture();
        
        e.currentTarget.classList.add('active');
        setTimeout(() => e.currentTarget.classList.remove('active'), 500);
      }
      
      return false;
    }

    document.querySelectorAll('.room').forEach(room => {
      room.addEventListener('click', (e) => {
        if (e.target.closest('.doll-character')) return;
        const roomName = room.dataset.room;
        characterRooms[selectedCharacter] = roomName;
        updateDollsInRooms();
        
        document.querySelectorAll('.room').forEach(r => r.classList.remove('active'));
        room.classList.add('active');
        setTimeout(() => room.classList.remove('active'), 500);
      });
      
      // Add drag and drop support
      room.addEventListener('dragover', handleDragOver);
      room.addEventListener('drop', handleDrop);
    });

    async function onConfigChange(config) {
      const baseSize = config.font_size || defaultConfig.font_size;
      const customFont = config.font_family || defaultConfig.font_family;
      const baseFontStack = 'system-ui, -apple-system, sans-serif';
      
      document.getElementById('game-title').textContent = config.game_title || defaultConfig.game_title;
      document.getElementById('game-title').style.fontSize = `${baseSize * 2.5}px`;
